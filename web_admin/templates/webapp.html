<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Шаблоны</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #222222);
            --hint: var(--tg-theme-hint-color, #999999);
            --link: var(--tg-theme-link-color, #2481cc);
            --btn: var(--tg-theme-button-color, #2481cc);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
            --card-bg: var(--tg-theme-bg-color, #ffffff);
            --border: var(--tg-theme-hint-color, #99999920);
            --success: #4caf50;
            --danger: #e53935;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 20px;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg);
            padding: 16px 16px 12px;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text);
        }

        .search-box {
            position: relative;
        }

        .search-box svg {
            position: absolute;
            left: 12px;
            top: 14px;
            width: 18px;
            height: 18px;
            color: var(--hint);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--secondary-bg);
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            resize: vertical;
            min-height: 100px;
            max-height: 160px;
            font-family: inherit;
            line-height: 1.4;
        }

        .search-input:focus {
            border-color: var(--btn);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--btn) 15%, transparent);
        }

        .search-input::placeholder {
            color: var(--hint);
        }

        .content {
            padding: 16px;
        }

        .section-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--hint);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            padding-left: 2px;
        }

        .matches-section {
            display: none;
            margin-bottom: 20px;
        }

        .matches-section.active {
            display: block;
        }

        .no-matches {
            text-align: center;
            padding: 24px 16px;
            color: var(--hint);
            font-size: 14px;
        }

        .template-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .template-card:active {
            transform: scale(0.98);
        }

        .template-card.matched {
            border-color: var(--btn);
            box-shadow: 0 2px 8px color-mix(in srgb, var(--btn) 12%, transparent);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }

        .card-question {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            flex: 1;
            line-height: 1.3;
            word-break: break-word;
        }

        .copy-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 10px;
            background: var(--secondary-bg);
            color: var(--hint);
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.15s;
            flex-shrink: 0;
        }

        .copy-btn:active {
            transform: scale(0.9);
        }

        .copy-btn.copied {
            background: var(--success);
            color: #fff;
        }

        .copy-btn svg {
            width: 18px;
            height: 18px;
        }

        .card-answer {
            font-size: 14px;
            color: var(--text);
            line-height: 1.5;
            word-break: break-word;
            opacity: 0.85;
        }

        .score-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            color: var(--btn);
            background: color-mix(in srgb, var(--btn) 12%, transparent);
            padding: 2px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--hint);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 15px;
        }

        .template-count {
            font-size: 13px;
            color: var(--hint);
            margin-bottom: 12px;
            padding-left: 2px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .template-card {
            animation: fadeIn 0.2s ease-out;
        }

        .card-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .card-actions button {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            border: none;
            border-radius: 8px;
            background: var(--secondary-bg);
            color: var(--hint);
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.15s;
        }

        .card-actions button:active {
            transform: scale(0.95);
        }

        .card-actions .edit-btn:hover {
            background: color-mix(in srgb, var(--btn) 15%, transparent);
            color: var(--btn);
        }

        .card-actions .delete-btn:hover {
            background: color-mix(in srgb, var(--danger) 15%, transparent);
            color: var(--danger);
        }

        .card-actions button svg {
            width: 14px;
            height: 14px;
        }

        .fab {
            position: fixed;
            right: 20px;
            bottom: 24px;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            border: none;
            background: var(--btn);
            color: #fff;
            box-shadow: 0 4px 12px color-mix(in srgb, var(--btn) 40%, transparent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, box-shadow 0.15s;
            z-index: 90;
        }

        .fab:active {
            transform: scale(0.92);
        }

        .fab svg {
            width: 24px;
            height: 24px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 200;
            display: none;
            align-items: flex-end;
            justify-content: center;
            animation: fadeInOverlay 0.2s ease-out;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: var(--bg);
            border-radius: 16px 16px 0 0;
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px 16px 24px;
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            background: var(--secondary-bg);
            color: var(--hint);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close svg {
            width: 18px;
            height: 18px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--hint);
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--secondary-bg);
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--btn);
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
            line-height: 1.4;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
        }

        .modal-actions button:active {
            transform: scale(0.97);
        }

        .btn-save {
            background: var(--btn);
            color: #fff;
        }

        .btn-cancel {
            background: var(--secondary-bg);
            color: var(--text);
        }

        .confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .confirm-overlay.active {
            display: flex;
        }

        .confirm-box {
            background: var(--bg);
            border-radius: 14px;
            padding: 20px;
            width: 280px;
            text-align: center;
        }

        .confirm-box p {
            font-size: 15px;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .confirm-box .confirm-actions {
            display: flex;
            gap: 10px;
        }

        .confirm-box .confirm-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-confirm-delete {
            background: var(--danger);
            color: #fff;
        }

        .btn-confirm-cancel {
            background: var(--secondary-bg);
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Шаблоны ответов</h1>
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <textarea class="search-input" id="searchInput" placeholder="Вставьте сообщение клиента..." rows="4"></textarea>
        </div>
    </div>

    <div class="content">
        <div class="matches-section" id="matchesSection">
            <div class="section-label">Подходящие ответы</div>
            <div id="matchesList"></div>
            <div class="no-matches" id="noMatches" style="display:none">
                Совпадений не найдено
            </div>
        </div>

        <div id="allSection">
            <div class="template-count" id="templateCount"></div>
            <div id="allList"></div>
            <div class="empty-state" id="emptyState" style="display:none">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                <p>Шаблонов пока нет</p>
            </div>
        </div>
    </div>

    <button class="fab" id="fabAdd" title="Добавить шаблон">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
    </button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Новый шаблон</h2>
                <button class="modal-close" id="modalClose">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="form-group">
                <label for="inputQuestion">Название (вопрос клиента)</label>
                <input type="text" id="inputQuestion" placeholder="Например: Сколько стоит?">
            </div>
            <div class="form-group">
                <label for="inputAnswer">Ответ</label>
                <textarea id="inputAnswer" placeholder="Текст ответа..." rows="4"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="btnCancel">Отмена</button>
                <button class="btn-save" id="btnSave">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-box">
            <p>Удалить этот шаблон?</p>
            <div class="confirm-actions">
                <button class="btn-confirm-cancel" id="confirmCancel">Отмена</button>
                <button class="btn-confirm-delete" id="confirmDelete">Удалить</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const userId = new URLSearchParams(window.location.search).get('uid')
            || tg?.initDataUnsafe?.user?.id
            || '';

        let allTemplates = [];

        async function loadTemplates() {
            try {
                const resp = await fetch(`/api/webapp/${userId}/templates`);
                if (!resp.ok) throw new Error('Failed to load');
                allTemplates = await resp.json();
                renderAll();
            } catch (e) {
                document.getElementById('allList').innerHTML =
                    '<div class="empty-state"><p>Ошибка загрузки</p></div>';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function createCard(tpl, isMatch, score) {
            const card = document.createElement('div');
            card.className = 'template-card' + (isMatch ? ' matched' : '');

            let scoreHtml = '';
            if (isMatch && score !== undefined) {
                scoreHtml = `<div class="score-badge">Совпадение: ${Math.round(score * 100)}%</div>`;
            }

            let actionsHtml = '';
            if (!isMatch) {
                actionsHtml = `
                <div class="card-actions">
                    <button class="edit-btn" data-id="${tpl.id}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                        Изменить
                    </button>
                    <button class="delete-btn" data-id="${tpl.id}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                        Удалить
                    </button>
                </div>`;
            }

            card.innerHTML = `
                ${scoreHtml}
                <div class="card-header">
                    <div class="card-question">${escapeHtml(tpl.question || 'Без названия')}</div>
                    <button class="copy-btn" data-answer="${escapeHtml(tpl.answer || '')}" title="Копировать ответ">
                        <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                        <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </button>
                </div>
                <div class="card-answer">${escapeHtml(tpl.answer || '')}</div>
                ${actionsHtml}
            `;

            const btn = card.querySelector('.copy-btn');
            btn.addEventListener('click', () => copyAnswer(btn, tpl.answer));

            if (!isMatch) {
                const editBtn = card.querySelector('.edit-btn');
                const deleteBtn = card.querySelector('.delete-btn');
                if (editBtn) editBtn.addEventListener('click', () => openEditModal(tpl));
                if (deleteBtn) deleteBtn.addEventListener('click', () => openConfirmDelete(tpl.id));
            }

            return card;
        }

        function copyAnswer(btn, text) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const iconCopy = btn.querySelector('.icon-copy');
                const iconCheck = btn.querySelector('.icon-check');
                btn.classList.add('copied');
                iconCopy.style.display = 'none';
                iconCheck.style.display = 'block';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    iconCopy.style.display = 'block';
                    iconCheck.style.display = 'none';
                }, 1500);
            });
        }

        function renderAll() {
            const list = document.getElementById('allList');
            const empty = document.getElementById('emptyState');
            const count = document.getElementById('templateCount');

            list.innerHTML = '';

            if (allTemplates.length === 0) {
                empty.style.display = 'block';
                count.textContent = '';
                return;
            }

            empty.style.display = 'none';
            count.textContent = `${allTemplates.length} шаблон${getPlural(allTemplates.length)}`;

            allTemplates.forEach(tpl => {
                list.appendChild(createCard(tpl, false));
            });
        }

        function getPlural(n) {
            const mod10 = n % 10;
            const mod100 = n % 100;
            if (mod10 === 1 && mod100 !== 11) return '';
            if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return 'а';
            return 'ов';
        }

        function matchTemplates(input) {
            if (!input.trim()) return [];

            const inputLower = input.toLowerCase().trim();
            const words = inputLower
                .replace(/[^\w\s\u0400-\u04FF\u0041-\u007A\u00C0-\u024F]/gi, ' ')
                .split(/\s+/)
                .filter(w => w.length > 2);

            if (words.length === 0 && inputLower.length > 0) {
                return allTemplates
                    .filter(tpl => (tpl.question || '').toLowerCase().includes(inputLower))
                    .map(tpl => ({ ...tpl, score: 1.0 }));
            }

            if (words.length === 0) return [];

            return allTemplates.map(tpl => {
                const q = (tpl.question || '').toLowerCase();
                let matches = 0;
                for (const word of words) {
                    if (q.includes(word)) matches++;
                }
                let score = matches / words.length;
                if (q.includes(inputLower)) score = Math.max(score, 0.8);
                if (inputLower.includes(q) && q.length > 3) score = Math.max(score, 0.9);
                return { ...tpl, score };
            }).filter(t => t.score > 0).sort((a, b) => b.score - a.score);
        }

        function renderMatches(input) {
            const section = document.getElementById('matchesSection');
            const list = document.getElementById('matchesList');
            const noMatches = document.getElementById('noMatches');

            if (!input.trim()) {
                section.classList.remove('active');
                return;
            }

            section.classList.add('active');
            list.innerHTML = '';

            const matches = matchTemplates(input);

            if (matches.length === 0) {
                noMatches.style.display = 'block';
            } else {
                noMatches.style.display = 'none';
                matches.forEach(tpl => {
                    list.appendChild(createCard(tpl, true, tpl.score));
                });
            }
        }

        const searchInput = document.getElementById('searchInput');

        function autoResize() {
            searchInput.style.height = 'auto';
            searchInput.style.height = Math.min(searchInput.scrollHeight, 160) + 'px';
        }

        let debounceTimer;
        searchInput.addEventListener('input', () => {
            autoResize();
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                renderMatches(searchInput.value);
            }, 200);
        });

        // ── Modal / CRUD ──

        const modalOverlay = document.getElementById('modalOverlay');
        const confirmOverlay = document.getElementById('confirmOverlay');
        const inputQuestion = document.getElementById('inputQuestion');
        const inputAnswer = document.getElementById('inputAnswer');
        const modalTitle = document.getElementById('modalTitle');

        let editingId = null;
        let deletingId = null;

        function openAddModal() {
            editingId = null;
            modalTitle.textContent = 'Новый шаблон';
            inputQuestion.value = '';
            inputAnswer.value = '';
            modalOverlay.classList.add('active');
            inputQuestion.focus();
        }

        function openEditModal(tpl) {
            editingId = tpl.id;
            modalTitle.textContent = 'Редактировать шаблон';
            inputQuestion.value = tpl.question || '';
            inputAnswer.value = tpl.answer || '';
            modalOverlay.classList.add('active');
            inputQuestion.focus();
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            editingId = null;
        }

        function openConfirmDelete(id) {
            deletingId = id;
            confirmOverlay.classList.add('active');
        }

        function closeConfirm() {
            confirmOverlay.classList.remove('active');
            deletingId = null;
        }

        async function saveTemplate() {
            const question = inputQuestion.value.trim();
            const answer = inputAnswer.value.trim();
            if (!question && !answer) return;

            const url = `/api/webapp/${userId}/templates`;
            const method = editingId ? 'PUT' : 'POST';
            const fetchUrl = editingId ? `${url}/${editingId}` : url;

            try {
                const resp = await fetch(fetchUrl, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': tg?.initData || '',
                    },
                    body: JSON.stringify({ question, answer }),
                });
                if (!resp.ok) throw new Error('Failed to save');
                closeModal();
                await loadTemplates();
            } catch (e) {
                alert('Ошибка сохранения');
            }
        }

        async function deleteTemplate() {
            if (!deletingId) return;
            try {
                const resp = await fetch(
                    `/api/webapp/${userId}/templates/${deletingId}`,
                    {
                        method: 'DELETE',
                        headers: {
                            'X-Telegram-Init-Data': tg?.initData || '',
                        },
                    },
                );
                if (!resp.ok) throw new Error('Failed to delete');
                closeConfirm();
                await loadTemplates();
            } catch (e) {
                alert('Ошибка удаления');
            }
        }

        document.getElementById('fabAdd').addEventListener('click', openAddModal);
        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('btnCancel').addEventListener('click', closeModal);
        document.getElementById('btnSave').addEventListener('click', saveTemplate);
        document.getElementById('confirmCancel').addEventListener('click', closeConfirm);
        document.getElementById('confirmDelete').addEventListener('click', deleteTemplate);

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        confirmOverlay.addEventListener('click', (e) => {
            if (e.target === confirmOverlay) closeConfirm();
        });

        loadTemplates();
    </script>
</body>
</html>
